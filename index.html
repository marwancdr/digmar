<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Content Planner – Arrayyan Al Mubarak</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#e8eefc;--card:#fff;--ink:#14224a;--mut:#6b7794;--pri:#2d6cf0;--navy:#0f2350;--soft:#dde7fb;--line:#e3e9f7;--amber:#fff3c9;--bar:#f5f8ff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1226;--card:#141d38;--ink:#e8eeff;--mut:#8f9bbb;--soft:#1b2748;--line:#243055;--amber:#3a3217;--bar:#18223f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0b1226;--card:#141d38;--ink:#e8eeff;--mut:#8f9bbb;--soft:#1b2748;--line:#243055;--amber:#3a3217;--bar:#18223f;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:Outfit,system-ui,sans-serif;font-size:14px}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer;border:0}
input,select,textarea{background:var(--bar);border:1px solid var(--line);border-radius:10px;padding:9px 10px;width:100%}
:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
.app{display:grid;grid-template-columns:230px 1fr;gap:14px;padding:12px;max-width:1500px;margin:auto}
aside{background:var(--card);border-radius:22px;padding:14px;display:flex;flex-direction:column;gap:6px;position:sticky;top:12px;height:calc(100vh - 24px);overflow:auto}
.brand{display:flex;gap:10px;align-items:center;padding:6px 6px 14px;border-bottom:1px solid var(--line);margin-bottom:8px}
.logo{width:38px;height:38px;border-radius:12px;background:var(--pri);color:#fff;display:grid;place-items:center;font-weight:700}
.brand b{display:block;font-size:15px}.brand small{color:var(--mut);font-size:10px}
nav button{display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;border-radius:12px;background:none;font-weight:500;text-align:left}
nav button:hover{background:var(--soft)}nav button.on{background:var(--navy);color:#fff}
nav .n{margin-left:auto;background:var(--soft);color:var(--pri);border-radius:8px;font-size:11px;padding:1px 7px}
.exp{background:var(--soft);border-radius:16px;padding:12px;margin-top:8px}
.exp p{margin:2px 0 10px;font-size:11px;color:var(--mut)}
.btn{background:var(--pri);color:#fff;border-radius:12px;padding:9px 14px;font-weight:600}
.btn.g{background:var(--soft);color:var(--ink)}.btn.r{background:#fee2e2;color:#b91c1c}
.notes{background:var(--amber);border-radius:16px;padding:12px;flex:1;min-height:120px}
.notes h4{margin:0 0 8px;display:flex;justify-content:space-between;align-items:center;font-size:13px}
.notes h4 button{background:#f5b21a;color:#fff;width:24px;height:24px;border-radius:50%;line-height:1}
.note{background:var(--card);border-radius:10px;padding:8px 10px;margin-bottom:6px;font-size:12px;display:flex;gap:6px;justify-content:space-between}
.note small{color:var(--mut);display:block}
.x{background:none;color:var(--mut);padding:0 4px}
.me{display:flex;gap:10px;align-items:center;padding-top:8px}
.av{width:34px;height:34px;border-radius:10px;background:var(--pri);color:#fff;display:grid;place-items:center;font-weight:700;font-size:12px}
main{min-width:0}
.top{background:linear-gradient(100deg,#2b5bc7,#6f9cf5);border-radius:22px;padding:14px 20px;display:flex;gap:12px;align-items:center;color:#fff;flex-wrap:wrap}
.top h1{margin:0;font-size:19px}.top small{opacity:.85}
.top .sp{flex:1 1 40px}
.search{flex:1 1 200px;max-width:340px;border-radius:14px;border:0;padding:10px 14px;background:#fff;color:#14224a}
.chip{background:rgba(255,255,255,.2);border-radius:12px;padding:8px 11px;font-weight:600;color:#fff}
.chip.w{background:#fff;color:#14224a}
.cols{display:grid;grid-template-columns:1fr 290px;gap:14px;margin-top:14px}
.hero{background:var(--navy);color:#fff;border-radius:22px;padding:22px;display:flex;gap:22px;align-items:center;flex-wrap:wrap}
.ring{width:96px;height:96px;border-radius:50%;display:grid;place-items:center;font-size:20px;font-weight:700;flex:none}
.ring i{width:74px;height:74px;border-radius:50%;background:var(--navy);display:grid;place-items:center;font-style:normal}
.hero h2{margin:2px 0 6px;font-size:22px}
.hero .big{font-size:20px;font-weight:600}.hero .big b{font-size:26px;color:#7dffb3}
.pb{height:6px;background:#ffffff30;border-radius:6px;max-width:280px;margin:8px 0}
.pb div{height:100%;border-radius:6px;background:#7dffb3;transition:width .4s}
.cta{margin-left:auto;background:var(--pri);color:#fff;border-radius:14px;padding:12px 20px;font-weight:600;box-shadow:0 0 0 3px #9ec1ff55}
h3{margin:22px 4px 12px;font-size:15px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.tile{background:var(--soft);border-radius:18px;padding:20px 8px;display:flex;flex-direction:column;align-items:center;gap:10px;font-weight:600;position:relative}
.tile:hover{transform:translateY(-2px)}
.ic{width:42px;height:42px;border-radius:12px;background:var(--card);display:grid;place-items:center;font-size:20px}
.bd{position:absolute;top:10px;right:22%;background:#ef4444;color:#fff;border-radius:9px;font-size:10px;min-width:18px;height:18px;display:grid;place-items:center}
.card{background:var(--card);border-radius:20px;padding:16px}
.card h4{margin:0 0 12px;font-size:15px;display:flex;justify-content:space-between;align-items:center}
.days{display:flex;justify-content:space-between;margin-top:12px;font-size:10px;color:var(--mut);text-align:center}
.dot{display:block;width:18px;height:18px;border-radius:50%;border:2px solid var(--line);margin:4px auto 0}
.dot.d{background:var(--pri);border-color:var(--pri)}.dot.t{border-color:#8b5cf6}
.tw{display:flex;gap:14px;align-items:center}
.tr{width:76px;height:76px;border-radius:50%;flex:none;display:grid;place-items:center}
.tr i{width:58px;height:58px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-style:normal;font-size:15px;font-weight:700}
.top5{padding:0;margin:0}
.top5 li{list-style:none;display:flex;gap:8px;align-items:center;padding:7px 0;font-size:12px}
.rk{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:10px;font-weight:700;background:var(--soft)}
.top5 li:nth-child(1) .rk{background:#fbbf24;color:#fff}.top5 li:nth-child(2) .rk{background:#94a3b8;color:#fff}.top5 li:nth-child(3) .rk{background:#f97316;color:#fff}
.t{flex:1;min-width:0}.t b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.t span,.mut{color:var(--mut);font-size:11px}
.lanj{display:flex;gap:16px;align-items:center;padding:12px;border-radius:20px;background:linear-gradient(100deg,#e9e3ff,#fbe6f3);color:#14224a}
.th{width:110px;height:80px;border-radius:14px;background:var(--pri);color:#fff;display:grid;place-items:center;text-align:center;font-size:11px;flex:none}
.buka{background:#7c3aed;color:#fff;border-radius:22px;padding:11px 22px;font-weight:600}
.pipe{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.col{background:var(--card);border-radius:18px;padding:12px;min-height:120px}
.col h5{margin:0 0 8px;font-size:13px;display:flex;justify-content:space-between}
.it{background:var(--bar);border-radius:10px;padding:8px 10px;margin-bottom:6px;font-size:12px}
.it small{color:var(--mut);display:block}
.empty{background:var(--card);border-radius:20px;padding:26px;text-align:center;color:var(--mut)}
.empty p{margin:0 0 14px}
.row{display:flex;gap:10px;align-items:center;background:var(--card);border-radius:16px;padding:12px 14px;margin-bottom:8px;flex-wrap:wrap}
.row .t{min-width:160px}.row select{width:auto}
.tag{font-size:11px;background:var(--soft);border-radius:8px;padding:2px 8px;color:var(--pri)}
.late{color:#dc2626;font-weight:600}
.bar{display:flex;gap:10px;align-items:center;justify-content:space-between;margin:4px 4px 12px;flex-wrap:wrap}
.bar h2{margin:0;font-size:20px}
.warn{background:#fff3c9;color:#5c4400;border-radius:14px;padding:10px 14px;margin-bottom:12px;font-size:12px}
dialog{border:0;border-radius:20px;padding:20px;width:min(440px,92vw);background:var(--card);color:var(--ink)}
dialog::backdrop{background:#0008}
dialog label{display:block;font-size:12px;color:var(--mut);margin:10px 0 3px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 18px;border-radius:14px;opacity:0;pointer-events:none;transition:opacity .25s}
.toast.s{opacity:1}
.fl{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:0 4px 12px}
.pill{background:var(--card);border-radius:999px;padding:7px 14px;font-weight:500;color:var(--ink)}
.pill small{color:var(--mut)}.pill.on{background:var(--navy);color:#fff}.pill.on small{color:#ffffffaa}
.days{flex-wrap:wrap;gap:8px 10px;justify-content:flex-start}
.mg{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px}
.mg div{background:var(--bar);border-radius:12px;padding:10px}.mg b{display:block;font-size:18px}
.pc{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:12px}
.res{display:none;margin-top:8px;padding:10px;background:var(--bar);border-radius:12px}.res.o{display:block}
.res .three{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
@media(max-width:760px){.pc{grid-template-columns:1fr}}
#auth{position:fixed;inset:0;z-index:50;background:var(--bg);display:grid;place-items:center;padding:20px}
#auth[hidden]{display:none}
#auth form{background:var(--card);border-radius:22px;padding:26px;width:min(380px,100%)}
#auth label{display:block;font-size:12px;color:var(--mut);margin:10px 0 3px}
#auth .err{color:#dc2626;font-size:12px;min-height:16px;margin-top:8px}
@media(max-width:1100px){.cols{grid-template-columns:1fr}}
@media(max-width:760px){.app{grid-template-columns:1fr}aside{position:static;height:auto}.grid,.pipe{grid-template-columns:repeat(2,1fr)}.cta{margin-left:0}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
<aside>
  <div class="brand"><div class="logo">CP</div><div><b>Content Planner</b><small>Digital Marketing</small></div></div>
  <nav id="nav"></nav>
  <div class="exp"><b style="font-size:12px">Export ke Sheet</b><p>Data otomatis tersimpan di Google Sheet. Unduh CSV bila perlu.</p><button class="btn" id="exp" style="width:100%">Export</button></div>
  <div class="notes"><h4>Catatan <button id="addNote" aria-label="Tambah catatan">+</button></h4><div id="notes"></div></div>
  <div class="me"><div class="av">AM</div><div><b style="font-size:13px">Arrayyan Al Mubarak</b><br><small class="mut">Digital Marketing</small></div></div>
</aside>
<main>
  <header class="top">
    <div><h1>Arrayyan Al Mubarak</h1><small>Digital Marketing</small></div>
    <input class="search" id="q" placeholder="Cari konten…" aria-label="Cari konten">
    <span class="sp"></span>
    <span class="chip" id="wkchip"></span><span class="chip" id="streak">🔥 0</span>
    <button class="chip" id="theme" aria-label="Ganti tema">🌙</button>
    <button class="chip w" id="new">+ Konten baru</button>
  </header>
  <div id="warn"></div>
  <div id="view"></div>
</main>
</div>
<dialog id="dlg"><form method="dialog" id="f" style="margin:0"></form></dialog>
<div class="toast" id="toast" role="status"></div>
<script>
// ISI dengan URL Web App dari Google Apps Script (lihat tutorial)
const API_URL="https://script.google.com/macros/s/AKfycby7GZ4h1s72JBPHKQHgfXku2K7zQBDQu2F7U1hdScymKJNy9iqOgLrbki2kpeDT3ETmmg/exec";
const $=s=>document.querySelector(s);
const e=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ST={ide:"Ide",draf:"Draf",jadwal:"Dijadwalkan",tayang:"Tayang"};
const now0=new Date();
const dim=(y,m)=>new Date(y,m,0).getDate();
const wkOf=d=>d<=7?1:d<=14?2:d<=21?3:4;
const wkRange=(y,m,w)=>w===4?[22,dim(y,m)]:[(w-1)*7+1,w*7];
const MON=["Jan","Feb","Mar","Apr","Mei","Jun","Jul","Agu","Sep","Okt","Nov","Des"];
let C=[],I=[],N=[],view="beranda",qs="",db=null,mem=false,uname="",pm=now0.getFullYear()+"-"+String(now0.getMonth()+1).padStart(2,"0"),pw=wkOf(now0.getDate());
const num=v=>v===""||v==null||isNaN(+v)?null:+v;
const inter=c=>["likes","comments","shares","saves"].reduce((a,k)=>a+(+c[k]||0),0);
const hasI=c=>["likes","comments","shares","saves"].some(k=>c[k]!=null);
const erOf=c=>+c.views>0?(hasI(c)?inter(c)/c.views*100:(+c.er||0)):0;
const lk=l=>/^https?:\/\//i.test(l||"")?l:"";
const inP=c=>{if(!c.date)return pw===0;const d=new Date(c.date);return d.getFullYear()+"-"+pad(d.getMonth()+1)===pm&&(pw===0||wkOf(d.getDate())===pw)};
function fbar(){const[y,m]=pm.split("-").map(Number);return`<div class="fl"><input type="month" id="pmI" value="${pm}" aria-label="Bulan" style="width:auto">${[1,2,3,4].map(w=>{const[a,b]=wkRange(y,m,w);return`<button class="pill ${pw===w?"on":""}" data-w="${w}">Week ${w} <small>${a}–${b}</small></button>`}).join("")}<button class="pill ${pw===0?"on":""}" data-w="0">Semua</button></div>`}
const NAV=[["beranda","🏠","Beranda"],["konten","🗓️","Konten"],["idea","💡","Idea Bank"],["analytics","📈","Analytics"]];
let tt;function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("s");clearTimeout(tt);tt=setTimeout(()=>t.classList.remove("s"),2000)}
const pad=n=>String(n).padStart(2,"0");
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const fmt=s=>{if(!s)return"Belum dijadwalkan";const d=new Date(s);return d.toLocaleString("id-ID",{weekday:"short",day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"}).replace(".",":")};
const nf=n=>n>=1000?(n/1000).toFixed(1).replace(".",",")+" rb":String(n||0);
// ---- penyimpanan (Google Sheets) ----
const API_OK=!API_URL.startsWith("ISI");
let last="",pend=0;
const nid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const LST=c=>c==="contents"?C:c==="ideas"?I:N;
const setL=(c,L)=>{if(c==="contents")C=L;else if(c==="ideas")I=L;else N=L};
async function sync(){
  if(!API_OK||pend)return;
  try{
    const r=await fetch(API_URL+"?action=list&t="+Date.now()),j=await r.json();if(!j.ok)throw new Error(j.error||"gagal memuat");
    $("#warn").innerHTML="";const k=JSON.stringify(j.data);if(k===last)return;
    last=k;C=j.data.contents;I=j.data.ideas;N=j.data.notes;draw();
  }catch(x){$("#warn").innerHTML='<div class="warn">Tidak bisa terhubung ke Google Sheet, jadi data mungkin belum terbaru. ('+e(x.message||x)+')</div>'}
}
async function api(body){
  if(!API_OK)return;pend++;
  try{
    const r=await fetch(API_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(body)});
    const j=await r.json();if(!j.ok)throw new Error(j.error||"gagal");
  }catch(x){last="";toast("Gagal menyimpan ke Google Sheet: "+(x.message||x))}
  finally{pend--;sync()}
}
async function put(c,id,data,merge){
  const L=LST(c),old=L.find(x=>x.id===id),body={...(merge&&old?old:{}),...data,id};
  setL(c,[body,...L.filter(x=>x.id!==id)]);draw();
  await api({action:"put",c,id,data:body});
}
async function del(c,id){setL(c,LST(c).filter(x=>x.id!==id));draw();await api({action:"del",c,id})}
// ---- hitung ----
function stats(){
  const n=new Date(),y=n.getFullYear(),m=n.getMonth()+1,td=n.getDate(),w=wkOf(td),[a,b]=wkRange(y,m,w),L=dim(y,m);
  const T=C.filter(c=>c.status==="tayang"&&c.date);
  const days=new Set(T.filter(c=>{const d=new Date(c.date);return d.getFullYear()===y&&d.getMonth()+1===m}).map(c=>new Date(c.date).getDate()));
  let wd=0;for(let i=a;i<=b;i++)if(days.has(i))wd++;
  const set=new Set(T.map(c=>iso(new Date(c.date))));let streak=0,d=new Date();if(!set.has(iso(d)))d.setDate(d.getDate()-1);
  while(set.has(iso(d))){streak++;d.setDate(d.getDate()-1)}
  return{y,m,td,w,a,b,L,days,wd,month:days.size,streak};
}
function statsOld(){
  const now=new Date(),mo=now.getMonth(),yr=now.getFullYear();
  const wd=(now.getDay()+6)%7,ws=new Date(now);ws.setHours(0,0,0,0);ws.setDate(ws.getDate()-wd);
  const T=C.filter(c=>c.status==="tayang"&&c.date);
  const month=T.filter(c=>{const d=new Date(c.date);return d.getMonth()===mo&&d.getFullYear()===yr}).length;
  const days=[0,0,0,0,0,0,0];let week=0;
  T.forEach(c=>{const d=new Date(c.date),diff=Math.floor((new Date(d).setHours(0,0,0,0)-ws)/864e5);if(diff>=0&&diff<7){days[diff]=1;week++}});
  const set=new Set(T.map(c=>iso(new Date(c.date))));let streak=0,d=new Date();if(!set.has(iso(d)))d.setDate(d.getDate()-1);
  while(set.has(iso(d))){streak++;d.setDate(d.getDate()-1)}
  return{month,week,days,wd,streak};
}
// ---- tampilan ----
function nav(){$("#nav").innerHTML=NAV.map(n=>`<button class="${view===n[0]?"on":""}" data-v="${n[0]}"><span>${n[1]}</span>${n[2]}${n[0]==="idea"&&I.length?`<span class="n">${I.length}</span>`:""}</button>`).join("")}
function match(c){return !qs||(c.title+" "+(c.campaign||"")+" "+c.platform).toLowerCase().includes(qs)}
function draw(){
  nav();const s=stats();
  $("#streak").textContent="🔥 "+s.streak;$("#wkchip").textContent=`Week ${s.w} · ${s.a}–${s.b} ${MON[s.m-1]}`;
  $("#notes").innerHTML=N.slice().sort((a,b)=>b.at-a.at).map(n=>`<div class="note"><button class="x" style="text-align:left;color:inherit;flex:1" data-en="${n.id}" aria-label="Ubah catatan"><b>${e(n.text)}</b><small>${new Date(n.at).toLocaleDateString("id-ID",{day:"numeric",month:"short"})}</small></button><button class="x" data-dn="${n.id}" aria-label="Hapus catatan">✕</button></div>`).join("")||'<small class="mut">Belum ada catatan. Tekan + untuk menambah.</small>';
  const v=$("#view");
  if(view==="beranda")v.innerHTML=home(s);else if(view==="konten")v.innerHTML=list();else if(view==="idea")v.innerHTML=ideas();else v.innerHTML=analytics();
}
function emptyBox(){return`<div class="empty"><p><b>Belum ada konten.</b><br>Tambahkan konten pertama atau isi dengan data contoh untuk mencoba.</p><button class="btn" data-a="new">+ Konten baru</button> <button class="btn g" data-a="seed">Isi data contoh</button></div>`}
function home(s){
  const T=s.b-s.a+1,left=T-s.wd,pct=Math.round(s.month/s.L*100),ym=s.y+"-"+pad(s.m);
  const lanj=C.filter(c=>c.status==="draf").sort((a,b)=>(a.date||"9").localeCompare(b.date||"9"))[0];
  const top=C.filter(c=>c.status==="tayang"&&c.views&&(c.date||"").startsWith(ym)).sort((a,b)=>b.views-a.views).slice(0,5);
  const menu=[["🗓️","Konten","konten"],["💡","Idea Bank","idea",I.length],["📈","Analytics","analytics"],["📊","Export Sheet","exp"]];
  const pl=k=>C.filter(c=>c.status===k&&match(c)&&(k!=="tayang"||((c.date||"").startsWith(ym)&&wkOf(+c.date.slice(8,10))===s.w)));
  const dots=[];for(let i=s.a;i<=s.b;i++)dots.push(`<div>${i}<span class="dot ${s.days.has(i)?"d":i===s.td?"t":""}"></span></div>`);
  return`<div class="cols"><div>
  <section class="hero"><div class="ring" style="background:conic-gradient(#7dffb3 ${pct*3.6}deg,#ffffff25 0)"><i>${pct}%</i></div>

async function csvOld(){
  const h=["Judul","Platform","Format","Status","Jadwal","Campaign","Views","ER (%)"];
  const q=v=>'"'+String(v??"").replace(/"/g,'""')+'"';
  const t="\ufeff"+[h,...C.map(c=>[c.title,c.platform,c.format,ST[c.status],c.date,c.campaign,c.views,c.er])].map(r=>r.map(q).join(",")).join("\n");
  try{const u=URL.createObjectURL(new Blob([t],{type:"text/csv;charset=utf-8"})),a=document.createElement("a");a.href=u;a.download="content-planner.csv";a.click();URL.revokeObjectURL(u);toast("File CSV diunduh")}catch(x){toast("Gagal mengunduh")}
}
// ---- event ----
document.addEventListener("click",ev=>{
  const g=k=>{const b=ev.target.closest("["+k+"]");return b&&b.getAttribute(k)};
  const v=g("data-v"),ed=g("data-edit"),a=g("data-a"),dn=g("data-dn"),di=g("data-di"),go=g("data-go");
  const wk=g("data-w");if(wk!==null){pw=+wk;draw();return}
  if(v==="exp")return csv();
  if(v){view=v;draw();return}
  if(ed)return form(C.find(c=>c.id===ed));
  if(a==="new")return form();
  if(a==="seed")return seed();
  if(a==="idea"){const t=$("#ni").value.trim();if(t){put("ideas",nid(),{text:t,at:Date.now()});toast("Ide disimpan")}return}
  const en=g("data-en");if(en)return noteForm(N.find(x=>x.id===en));if(dn)return del("notes",dn);if(di)return del("ideas",di);
  if(go){const i=I.find(x=>x.id===go);del("ideas",go);put("contents",nid(),{title:i.text,platform:"Instagram",format:"Feed",status:"draf",date:"",campaign:"",views:0,er:0,createdAt:Date.now()});view="konten";draw();toast("Ide dipindah ke Konten")}
});
document.addEventListener("change",ev=>{if(ev.target.id==="pmI"&&ev.target.value){pm=ev.target.value;draw();return}const id=ev.target.dataset.st;if(id)put("contents",id,{status:ev.target.value},true)});
$("#new").onclick=()=>form();$("#exp").onclick=csv;
function noteForm(n){n=n||{};$("#f").innerHTML=`<h3 style="margin:0 0 6px">${n.id?"Ubah catatan":"Catatan baru"}</h3><label for="nt">Isi catatan</label><textarea id="nt" rows="4" required>${e(n.text)}</textarea><div style="display:flex;gap:8px;margin-top:16px;justify-content:space-between"><span>${n.id?'<button type="button" class="btn r" id="nd">Hapus</button>':""}</span><span><button type="button" class="btn g" id="aa">Batal</button> <button class="btn" id="ab">Simpan</button></span></div>`;$("#dlg").showModal();$("#nt").focus();$("#aa").onclick=()=>$("#dlg").close();if(n.id)$("#nd").onclick=()=>{del("notes",n.id);$("#dlg").close()};$("#ab").onclick=ev=>{const t=$("#nt").value.trim();if(!t)return;ev.preventDefault();put("notes",n.id||nid(),{text:t,at:n.at||Date.now()});$("#dlg").close();toast("Catatan disimpan")}}
$("#addNote").onclick=()=>noteForm();
$("#q").oninput=ev=>{qs=ev.target.value.toLowerCase();if(view==="beranda"||view==="konten")draw()};
$("#theme").onclick=()=>{const r=document.documentElement,d=r.dataset.theme==="dark"||(!r.dataset.theme&&matchMedia("(prefers-color-scheme:dark)").matches);r.dataset.theme=d?"light":"dark";$("#theme").textContent=d?"🌙":"☀️"};
// ---- mulai ----
draw();
if(!API_OK)$("#warn").innerHTML='<div class="warn">Belum terhubung ke Google Sheet, jadi data hanya sementara. Isi API_URL di bagian atas file ini.</div>';
else sync();
setInterval(()=>{if(document.hidden||$("#dlg").open)return;const a=document.activeElement;if(a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)&&$("#view").contains(a))return;sync()},20000);
document.addEventListener("visibilitychange",()=>{if(!document.hidden)sync()});
</script>
</body>
</html>
