<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Content Planner – Arrayyan Al Mubarak</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f8fc;--card:#fff;--ink:#0f172a;--mut:#64748b;--pri:#4f6bed;--tb:#0f172a;--soft:#eef2ff;--line:#e7ebf3;--amber:#fff7e0;--warnc:#92400e;--bar:#f8fafc;--ok:#16a34a;--bad:#dc2626;--sh:0 1px 2px rgba(16,24,40,.05);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b0f1a;--card:#121826;--ink:#e6eaf2;--mut:#8b96a9;--pri:#6a82f7;--soft:#1a2238;--line:#212a3b;--amber:#2a2412;--warnc:#fcd34d;--bar:#161d2d;--ok:#34d399;--bad:#f87171;--sh:none;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0b0f1a;--card:#121826;--ink:#e6eaf2;--mut:#8b96a9;--pri:#6a82f7;--soft:#1a2238;--line:#212a3b;--amber:#2a2412;--warnc:#fcd34d;--bar:#161d2d;--ok:#34d399;--bad:#f87171;--sh:none;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;font-size:14px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer;border:0;background:none}
input,select,textarea{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 11px;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid color-mix(in srgb,var(--pri) 35%,transparent);border-color:var(--pri)}
:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
.app{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100vh}
aside{background:var(--card);border-right:1px solid var(--line);padding:18px 14px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh;overflow:auto}
main{padding:22px 28px 44px;max-width:1500px;width:100%}
.brand{display:flex;gap:10px;align-items:center;padding:2px 6px 16px}
.logo{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,var(--pri),#8b5cf6);color:#fff;display:grid;place-items:center;font-weight:700;font-size:13px}
.brand b{display:block;font-size:15px}.brand small{color:var(--mut);font-size:11px}
nav{display:flex;flex-direction:column;gap:2px}
nav button{display:flex;align-items:center;gap:11px;width:100%;padding:9px 12px;border-radius:10px;color:var(--mut);font-weight:500;text-align:left}
nav button svg{flex:none}
nav button:hover{background:var(--bar);color:var(--ink)}
nav button.on{background:var(--soft);color:var(--pri);font-weight:600}
nav .n{margin-left:auto;background:var(--pri);color:#fff;border-radius:999px;font-size:10px;padding:1px 7px;font-weight:600}
.exp{background:var(--soft);border-radius:14px;padding:12px;margin-top:14px}
.exp p{margin:2px 0 10px;font-size:11px;color:var(--mut)}
.btn{background:var(--pri);color:#fff;border-radius:10px;padding:9px 14px;font-weight:600;display:inline-block;text-decoration:none;text-align:center}
.btn:hover{filter:brightness(.95)}
.btn.g{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn.r{background:transparent;color:var(--bad);border:1px solid var(--line)}
.notes{background:var(--bar);border:1px solid var(--line);border-radius:14px;padding:12px;flex:1;min-height:120px;margin-top:8px}
.notes h4{margin:0 0 8px;display:flex;justify-content:space-between;align-items:center;font-size:13px}
.notes h4 button{background:var(--pri);color:#fff;width:24px;height:24px;border-radius:8px;line-height:1}
.note{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-bottom:6px;font-size:12px;display:flex;gap:6px;justify-content:space-between}
.note small{color:var(--mut);display:block}
.x{background:none;color:var(--mut);padding:0 4px}
.me{display:flex;gap:10px;align-items:center;padding-top:12px;margin-top:8px;border-top:1px solid var(--line)}
.av{width:34px;height:34px;border-radius:10px;background:var(--soft);color:var(--pri);display:grid;place-items:center;font-weight:700;font-size:12px}
.top{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:22px}
.top h1{margin:0;font-size:22px;letter-spacing:-.01em}.top small{color:var(--mut)}
.top .sp{flex:1 1 20px}
.search{flex:1 1 220px;max-width:360px}
.chip{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-weight:600;color:var(--ink)}
.chip.w{background:var(--pri);border-color:var(--pri);color:#fff}
.cols{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:20px}
.card,.hero,.lanj,.col,.row,.tile,.empty{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--sh)}
.card{padding:18px}
.card h4{margin:0 0 14px;font-size:14px;font-weight:600;display:flex;justify-content:space-between;align-items:center}
.hero{padding:22px;display:flex;gap:24px;align-items:center;flex-wrap:wrap}
.ring{width:92px;height:92px;border-radius:50%;display:grid;place-items:center;font-size:19px;font-weight:700;flex:none}
.ring i{width:70px;height:70px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-style:normal}
.hero h2{margin:2px 0 6px;font-size:17px;font-weight:600}
.hero .big{font-size:14px;color:var(--mut);font-weight:500}.hero .big b{font-size:36px;color:var(--ink);letter-spacing:-.02em;font-weight:700}
.pb{height:6px;background:var(--soft);border-radius:6px;max-width:280px;margin:10px 0}
.pb div{height:100%;border-radius:6px;background:var(--pri);transition:width .4s}
.cta,.buka{margin-left:auto;background:var(--pri);color:#fff;border-radius:10px;padding:11px 18px;font-weight:600}
h3{margin:28px 2px 12px;font-size:15px;font-weight:600}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:14px;padding:16px;font-weight:600;position:relative;text-align:left}
.tile:hover{border-color:var(--pri)}
.ic{width:36px;height:36px;border-radius:10px;background:var(--soft);color:var(--pri);display:grid;place-items:center}
.bd{position:absolute;top:14px;right:14px;background:var(--pri);color:#fff;border-radius:999px;font-size:10px;min-width:18px;height:18px;display:grid;place-items:center;padding:0 5px}
.days{display:flex;flex-wrap:wrap;gap:8px 10px;margin-top:14px;font-size:10px;color:var(--mut);text-align:center}
.dot{display:block;width:16px;height:16px;border-radius:50%;border:2px solid var(--line);margin:4px auto 0}
.dot.d{background:var(--pri);border-color:var(--pri)}.dot.t{border-color:var(--pri)}
.tw{display:flex;gap:14px;align-items:center}
.tr{width:72px;height:72px;border-radius:50%;flex:none;display:grid;place-items:center}
.tr i{width:54px;height:54px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-style:normal;font-size:15px;font-weight:700}
.top5{padding:0;margin:0}
.top5 li{list-style:none;display:flex;gap:10px;align-items:center;padding:8px 0;font-size:12px;border-bottom:1px solid var(--line)}
.top5 li:last-child{border:0}
.rk{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:10px;font-weight:700;background:var(--soft);color:var(--mut)}
.top5 li:nth-child(1) .rk{background:#fbbf24;color:#fff}.top5 li:nth-child(2) .rk{background:#94a3b8;color:#fff}.top5 li:nth-child(3) .rk{background:#f97316;color:#fff}
.t{flex:1;min-width:0}.t b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.t span,.mut{color:var(--mut);font-size:11px}
.lanj{display:flex;gap:16px;align-items:center;padding:14px}
.th{width:104px;height:76px;border-radius:12px;background:var(--soft);color:var(--pri);display:grid;place-items:center;text-align:center;font-size:11px;font-weight:600;flex:none}
.pipe{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.col{padding:12px;min-height:120px;background:var(--bar)}
.col h5{margin:0 0 10px;font-size:12px;font-weight:600;display:flex;justify-content:space-between;color:var(--mut);text-transform:uppercase;letter-spacing:.03em}
.it{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 10px;margin-bottom:6px;font-size:12px}
.it small{color:var(--mut);display:block}
.empty{padding:26px;text-align:center;color:var(--mut);box-shadow:none}
.empty p{margin:0 0 14px}
.row{display:flex;gap:10px;align-items:center;padding:12px 14px;margin-bottom:8px;flex-wrap:wrap;border-radius:12px}
.row .t{min-width:160px}.row select{width:auto}
.tag{font-size:11px;background:var(--soft);border-radius:6px;padding:2px 8px;color:var(--pri);font-weight:500}
.late,.t .late{color:var(--bad);font-weight:600}
.bar{display:flex;gap:10px;align-items:center;justify-content:space-between;margin:0 2px 14px;flex-wrap:wrap}
.bar h2{margin:0;font-size:20px}
.warn{background:var(--amber);color:var(--warnc);border-radius:12px;padding:10px 14px;margin-bottom:14px;font-size:12px}
.fl{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:0 2px 14px}
.pill{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-weight:500;color:var(--mut)}
.pill small{color:var(--mut)}.pill.on{background:var(--pri);border-color:var(--pri);color:#fff}.pill.on small{color:#ffffffb3}
.mg{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px}
.mg div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
.mg b{display:block;font-size:24px;letter-spacing:-.02em;margin:2px 0}
.pc{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-top:14px}
.rt{width:100%;border-collapse:collapse;font-size:12px;min-width:820px}
.rt th{background:var(--bar);color:var(--mut);font-size:11px;text-transform:uppercase;letter-spacing:.03em;padding:10px 8px;text-align:right;font-weight:600;border-bottom:1px solid var(--line)}
.rt td{padding:10px 8px;text-align:right;border-bottom:1px solid var(--line)}
.rt tr.sum td{background:var(--soft);font-weight:700;border:0}
.sc{overflow-x:auto}
.ch{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-top:14px}
.leg{font-size:11px;color:var(--mut);margin-top:4px}
.pho{display:none;font-weight:700;margin-bottom:10px}
.res{display:none;margin-top:8px;padding:12px;background:var(--bar);border:1px solid var(--line);border-radius:12px}.res.o{display:block}
.res .three{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
dialog{border:1px solid var(--line);border-radius:18px;padding:22px;width:min(460px,92vw);background:var(--card);color:var(--ink);box-shadow:0 20px 50px rgba(0,0,0,.2)}
dialog::backdrop{background:#0f172a80}
dialog label{display:block;font-size:12px;color:var(--mut);margin:10px 0 3px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--tb);color:#fff;padding:10px 16px;border-radius:10px;opacity:0;pointer-events:none;transition:opacity .25s;z-index:60}
.toast.s{opacity:1}
@media(max-width:1100px){.cols{grid-template-columns:1fr}}
@media(max-width:900px){.ch,.pc{grid-template-columns:1fr}}
@media(max-width:860px){.app{grid-template-columns:1fr}aside{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line)}main{padding:16px}.grid,.pipe{grid-template-columns:repeat(2,1fr)}.cta{margin-left:0}nav{flex-direction:row;overflow-x:auto}nav button{width:auto;white-space:nowrap}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
@media print{:root,:root[data-theme="dark"],:root:not([data-theme="light"]){--bg:#fff;--card:#fff;--ink:#0f172a;--mut:#64748b;--soft:#eef2ff;--line:#e7ebf3;--amber:#fff7e0;--bar:#f8fafc;--pri:#4f6bed;color-scheme:light}
aside,.top,.noprint,#warn,.toast{display:none!important}.app{display:block}main{padding:0}body{background:#fff}.card{break-inside:avoid}.pho{display:block}}
</style>
</head>
<body>
<div class="app">
<aside>
  <div class="brand"><div class="logo">CP</div><div><b>Content Planner</b><small>Digital Marketing</small></div></div>
  <nav id="nav"></nav>
  <div class="exp"><b style="font-size:12px">Export ke Sheet</b><p>Data otomatis tersimpan di Google Sheet. Unduh CSV bila perlu.</p><button class="btn" id="exp" style="width:100%">Export</button></div>
  <div class="notes"><h4>Catatan <button id="addNote" aria-label="Tambah catatan">+</button></h4><div id="notes"></div></div>
  <div class="me"><div class="av">AM</div><div><b style="font-size:13px">Arrayyan Al Mubarak</b><br><small class="mut">Digital Marketing</small></div></div>
</aside>
<main>
  <header class="top">
    <div><h1>Arrayyan Al Mubarak</h1><small>Digital Marketing</small></div>
    <input class="search" id="q" placeholder="Cari konten…" aria-label="Cari konten">
    <span class="sp"></span>
    <span class="chip" id="wkchip"></span><span class="chip" id="streak">🔥 0</span>
    <button class="chip" id="theme" aria-label="Ganti tema"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button>
    <button class="chip w" id="new">+ Konten baru</button>
  </header>
  <div id="warn"></div>
  <div id="view"></div>
</main>
</div>
<dialog id="dlg"><form method="dialog" id="f" style="margin:0"></form></dialog>
<div class="toast" id="toast" role="status"></div>
<script>
// ISI dengan URL Web App dari Google Apps Script (lihat tutorial)
const API_URL="https://script.google.com/macros/s/AKfycby7GZ4h1s72JBPHKQHgfXku2K7zQBDQu2F7U1hdScymKJNy9iqOgLrbki2kpeDT3ETmmg/exec";
const $=s=>document.querySelector(s);
const e=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ST={ide:"Ide",draf:"Draf",jadwal:"Dijadwalkan",tayang:"Tayang"};
const now0=new Date();
const dim=(y,m)=>new Date(y,m,0).getDate();
const wkOf=d=>d<=7?1:d<=14?2:d<=21?3:4;
const wkRange=(y,m,w)=>w===4?[22,dim(y,m)]:[(w-1)*7+1,w*7];
const MON=["Jan","Feb","Mar","Apr","Mei","Jun","Jul","Agu","Sep","Okt","Nov","Des"];
let C=[],I=[],N=[],view="beranda",qs="",db=null,mem=false,uname="",pm=now0.getFullYear()+"-"+String(now0.getMonth()+1).padStart(2,"0"),pw=wkOf(now0.getDate());
let R=[],rp="Instagram",rm=pm;
const num=v=>v===""||v==null||isNaN(+v)?null:+v;
const inter=c=>["likes","comments","shares","saves"].reduce((a,k)=>a+(+c[k]||0),0);
const hasI=c=>["likes","comments","shares","saves"].some(k=>c[k]!=null);
const erOf=c=>+c.views>0?(hasI(c)?inter(c)/c.views*100:(+c.er||0)):0;
const lk=l=>/^https?:\/\//i.test(l||"")?l:"";
const inP=c=>{if(!c.date)return pw===0;const d=new Date(c.date);return d.getFullYear()+"-"+pad(d.getMonth()+1)===pm&&(pw===0||wkOf(d.getDate())===pw)};
function fbar(){const[y,m]=pm.split("-").map(Number);return`<div class="fl"><input type="month" id="pmI" value="${pm}" aria-label="Bulan" style="width:auto">${[1,2,3,4].map(w=>{const[a,b]=wkRange(y,m,w);return`<button class="pill ${pw===w?"on":""}" data-w="${w}">Week ${w} <small>${a}–${b}</small></button>`}).join("")}<button class="pill ${pw===0?"on":""}" data-w="0">Semua</button></div>`}
const NAV=[["beranda","🏠","Beranda"],["konten","🗓️","Konten"],["idea","💡","Idea Bank"],["analytics","📈","Analytics"],["report","📑","Report"]];
let tt;function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("s");clearTimeout(tt);tt=setTimeout(()=>t.classList.remove("s"),2000)}
const pad=n=>String(n).padStart(2,"0");
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const fmt=s=>{if(!s)return"Belum dijadwalkan";const d=new Date(s);return d.toLocaleString("id-ID",{weekday:"short",day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"}).replace(".",":")};
const nf=n=>n>=1000?(n/1000).toFixed(1).replace(".",",")+" rb":String(n||0);
// ---- penyimpanan (Google Sheets) ----
const API_OK=!API_URL.startsWith("ISI");
let last="",pend=0;
const nid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const LST=c=>c==="contents"?C:c==="ideas"?I:c==="reports"?R:N;
const setL=(c,L)=>{if(c==="contents")C=L;else if(c==="ideas")I=L;else if(c==="reports")R=L;else N=L};
async function sync(){
  if(!API_OK||pend)return;
  try{
    const r=await fetch(API_URL+"?action=list&t="+Date.now()),j=await r.json();if(!j.ok)throw new Error(j.error||"gagal memuat");
    $("#warn").innerHTML="";const k=JSON.stringify(j.data);if(k===last)return;
    last=k;C=j.data.contents;I=j.data.ideas;N=j.data.notes;R=j.data.reports||[];draw();
  }catch(x){$("#warn").innerHTML='<div class="warn">Tidak bisa terhubung ke Google Sheet, jadi data mungkin belum terbaru. ('+e(x.message||x)+')</div>'}
}
async function api(body){
  if(!API_OK)return;pend++;
  try{
    const r=await fetch(API_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(body)});
    const j=await r.json();if(!j.ok)throw new Error(j.error||"gagal");
  }catch(x){last="";const m=String(x.message||x);toast(/koleksi|aksi/.test(m)?"Perbarui Code.gs di Apps Script dulu (lihat tutorial), lalu coba lagi.":"Gagal menyimpan ke Google Sheet: "+m)}
  finally{pend--;sync()}
}
async function put(c,id,data,merge){
  const L=LST(c),old=L.find(x=>x.id===id),body={...(merge&&old?old:{}),...data,id};
  setL(c,[body,...L.filter(x=>x.id!==id)]);draw();
  await api({action:"put",c,id,data:body});
}
async function putMany(c,items){const L=LST(c),ids=new Set(items.map(x=>x.id));setL(c,[...items.map(x=>({...x.data,id:x.id})),...L.filter(x=>!ids.has(x.id))]);draw();await api({action:"putmany",c,items})}
async function del(c,id){setL(c,LST(c).filter(x=>x.id!==id));draw();await api({action:"del",c,id})}
// ---- hitung ----
function stats(){
  const n=new Date(),y=n.getFullYear(),m=n.getMonth()+1,td=n.getDate(),w=wkOf(td),[a,b]=wkRange(y,m,w),L=dim(y,m);
  const T=C.filter(c=>c.status==="tayang"&&c.date);
  const days=new Set(T.filter(c=>{const d=new Date(c.date);return d.getFullYear()===y&&d.getMonth()+1===m}).map(c=>new Date(c.date).getDate()));
  let wd=0;for(let i=a;i<=b;i++)if(days.has(i))wd++;
  const set=new Set(T.map(c=>iso(new Date(c.date))));let streak=0,d=new Date();if(!set.has(iso(d)))d.setDate(d.getDate()-1);
  while(set.has(iso(d))){streak++;d.setDate(d.getDate()-1)}
  return{y,m,td,w,a,b,L,days,wd,month:days.size,streak};
}
function statsOld(){
  const now=new Date(),mo=now.getMonth(),yr=now.getFullYear();
  const wd=(now.getDay()+6)%7,ws=new Date(now);ws.setHours(0,0,0,0);ws.setDate(ws.getDate()-wd);
  const T=C.filter(c=>c.status==="tayang"&&c.date);
  const month=T.filter(c=>{const d=new Date(c.date);return d.getMonth()===mo&&d.getFullYear()===yr}).length;
  const days=[0,0,0,0,0,0,0];let week=0;
  T.forEach(c=>{const d=new Date(c.date),diff=Math.floor((new Date(d).setHours(0,0,0,0)-ws)/864e5);if(diff>=0&&diff<7){days[diff]=1;week++}});
  const set=new Set(T.map(c=>iso(new Date(c.date))));let streak=0,d=new Date();if(!set.has(iso(d)))d.setDate(d.getDate()-1);
  while(set.has(iso(d))){streak++;d.setDate(d.getDate()-1)}
  return{month,week,days,wd,streak};
}

  const rows=[1,2,3,4].map(w=>{const r=rrow(p,m,w),[a,b]=wkRange(y,mo,w);return`<tr><td style="text-align:left;white-space:nowrap">Week ${w} <span class="mut">${a}–${b}</span></td>${MET.map(([k])=>`<td>${r&&r[k]!=null?fn(r[k]):"–"}</td>`).join("")}<td class="noprint"><button class="btn g" style="padding:4px 10px" data-rw="${w}">${r?"Ubah":"Isi"}</button></td></tr>`}).join("");
  const ms=[...new Set(R.filter(r=>r.platform===p).map(r=>r.month))].sort().filter(x=>x<=m).slice(-6);
  const W4=["W1","W2","W3","W4"];
  const trend=ms.length?lineSvg(ms.map(mshort),[{name:"Impression",color:COL[0],vals:ms.map(x=>rsum(p,x).impression)},{name:"Reach",color:COL[1],vals:ms.map(x=>rsum(p,x).reach)}]):'<span class="mut">Belum ada data bulanan.</span>';

  <div class="bar"><h2>Report sosmed</h2><span class="noprint" style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn g" data-a="imp">Impor dari spreadsheet</button><button class="btn" data-a="print">Cetak / PDF</button></span></div>
  <div class="fl noprint"><input type="month" id="rmI" value="${m}" aria-label="Bulan" style="width:auto">${PLAT.map(x=>`<button class="pill ${x===p?"on":""}" data-rp="${x}">${x}</button>`).join("")}</div>
  ${has?"":`<div class="warn noprint">Belum ada data ${e(p)} untuk ${mlabel(m)}. Klik <b>Isi</b> pada tiap Week, atau tempel dari spreadsheet lewat <b>Impor</b>.</div>`}
  <div class="card"><h4>${e(p)} · ${mlabel(m)}</h4><div class="mg">${kpi}</div></div>
  <div class="card" style="margin-top:12px"><h4>Data per Week</h4><div class="sc"><table class="rt"><thead><tr><th style="text-align:left">Week</th>${MET.map(x=>`<th>${x[1]}</th>`).join("")}<th class="noprint"></th></tr></thead><tbody>${rows}<tr class="sum"><td style="text-align:left">SUM</td>${MET.map(([k])=>`<td>${fn(S[k])}</td>`).join("")}<td class="noprint"></td></tr></tbody></table></div></div>
  <div class="ch">
   <div class="card"><h4>Impression &amp; Reach per Week</h4>${barSvg(W4,[{name:"Impression",color:COL[0],vals:wv("impression")},{name:"Reach",color:COL[1],vals:wv("reach")}])}</div>
   <div class="card"><h4>Tren bulanan</h4>${trend}</div>
   <div class="card"><h4>Komposisi interaksi</h4>${hbar([["Like",S.like,COL[0]],["Share",S.share,COL[1]],["Comment",S.comment,COL[2]],["Save",S.save,COL[3]],["Repost",S.repost,COL[4]]])}</div>
   <div class="card"><h4>Follower baru &amp; Link Clicks per Week</h4>${barSvg(W4,[{name:"Follower",color:COL[2],vals:wv("follower")},{name:"Link Clicks",color:COL[3],vals:wv("clicks")}])}</div>
   <div class="card"><h4>Perbandingan platform (Impression)</h4>${hbar(PLAT.map((x,i)=>[x,rsum(x,m).impression,COL[i]]))}</div>
   <div class="card"><h4>Engagement per platform (ER dari Reach)</h4>${hbar(PLAT.map((x,i)=>[x,0,COL[i]]).map(a=>[a[0]+" "+reng(rsum(a[0],m)).toFixed(2).replace(".",",")+"%",reng(rsum(a[0],m)),a[2]]))}</div>
  </div>`;
}
function repForm(w){
  const r=rrow(rp,rm,w)||{},[y,mo]=rm.split("-").map(Number),[a,b]=wkRange(y,mo,w);

  $("#dlg").showModal();$("#aa").onclick=()=>$("#dlg").close();

  $("#ab").onclick=ev=>{ev.preventDefault();const d={platform:rp,month:rm,week:w};MET.forEach(([k],i)=>{const x=num($("#q"+i).value);if(x!==null)d[k]=x});put("reports",rid(rp,rm,w),d);$("#dlg").close();toast("Report disimpan")};

function parseRep(t){
  let cur=null;const out=[];
  t.split(/\r?\n/).forEach(line=>{
    const c=line.split("\t").map(x=>x.trim()),mm=/^([A-Za-z]{3,4})\s*(\d{4})$/.exec(c[0]||"");
    if(mm&&MI[mm[1].toLowerCase()])cur=mm[2]+"-"+pad(MI[mm[1].toLowerCase()]);
    if(cur&&/^[1-4]$/.test(c[1]||"")&&c.length>=3){const d={month:cur,week:+c[1]};MET.forEach(([k],i)=>{const v=(c[2+i]||"").replace(/\D/g,"");if(v!=="")d[k]=+v});out.push(d)}
  });
  return out;
}
function impForm(){
  $("#f").innerHTML=`<h3 style="margin:0 0 4px">Impor dari spreadsheet · ${e(rp)}</h3><div class="mut">Salin tabel dari spreadsheet (kolom Month, Week, Impression sampai Link Clicks; baris SUM boleh ikut) lalu tempel di bawah. Data masuk ke platform ${e(rp)}.</div><textarea id="imp" rows="8" style="margin-top:8px" placeholder="Tempel di sini"></textarea><div id="impn" class="mut" style="margin-top:6px"></div><div style="display:flex;gap:8px;margin-top:12px;justify-content:flex-end"><button type="button" class="btn g" id="aa">Batal</button> <button class="btn" id="ab">Impor</button></div>`;

  $("#ab").onclick=ev=>{ev.preventDefault();const L=parseRep($("#imp").value);if(!L.length){$("#impn").textContent="Tidak ada baris yang terbaca. Pastikan menyalin dari kolom Month sampai Link Clicks.";return}
    putMany("reports",L.map(d=>({id:rid(rp,d.month,d.week),data:{platform:rp,...d}})));$("#dlg").close();toast(L.length+" baris diimpor")};
}

async function seed(){
  const b=new Date();const d=(n,h)=>{const x=new Date(b);x.setDate(x.getDate()+n);x.setHours(h,0,0,0);return iso(x)+"T"+pad(h)+":00"};
  const S=[["Checklist harian tim","Instagram","Carousel","tayang",d(-1,10),"Produktivitas",2700,310,42,60,95],["Mulai! Challenge 7 hari","TikTok","Video","tayang",d(-2,18),"Challenge",2400,260,35,48,30],["Kenalan sama instruktur","YouTube","Video","tayang",d(-3,9),"Brand",2100,180,22,15,40],["Opini tren minggu ini","Threads","Post","tayang",d(0,8),"Edukasi",900,70,31,12],["Promo akhir tahun","Instagram","Carousel","draf",d(-1,18),"Promo"],["Testimoni klien","Instagram","Reels","jadwal",d(2,12),"Brand"],["Tips hemat budget iklan","Threads","Post","ide","","Edukasi"]];
  for(const x of S){const o={title:x[0],platform:x[1],format:x[2],status:x[3],date:x[4],campaign:x[5],createdAt:Date.now()};if(x[6]){o.views=x[6];o.likes=x[7];o.comments=x[8];o.shares=x[9];if(x[10]!=null)o.saves=x[10];o.er=+(inter(o)/o.views*100).toFixed(2)}await put("contents",nid(),o)}

}

document.addEventListener("click",ev=>{
  const g=k=>{const b=ev.target.closest("["+k+"]");return b&&b.getAttribute(k)};

  if(ed)return form(C.find(c=>c.id===ed));
  if(a==="print")return window.print();if(a==="imp")return impForm();if(a==="new")return form();

});

draw();
